<svg xmlns="http://www.w3.org/2000/svg" width="760" height="358">
  <style>
    .bg { fill: #1e1e2e; }
    .titlebar { fill: #313244; }
    .title { fill: #cdd6f4; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .t { fill: #cdd6f4; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .bold { fill: #cdd6f4; font-weight: bold; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .green { fill: #a6e3a1; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .green-bold { fill: #a6e3a1; font-weight: bold; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .red { fill: #f38ba8; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .yellow { fill: #f9e2af; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .prompt { fill: #89b4fa; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
  </style>
  <rect class="bg" width="760" height="358" rx="8"/>
  <rect class="titlebar" width="760" height="32" rx="8"/>
  <rect class="bg" x="0" y="24" width="760" height="8"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="16" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="16" r="6" fill="#a6e3a1"/>
  <text class="title" x="380" y="20" text-anchor="middle">Terminal</text>
  <text y="60" x="16"><tspan class="prompt">$</tspan><tspan class="t"> kiln Kilnfile</tspan></text>
  <text y="82" x="16"><tspan class="green-bold">[1/3]</tspan><tspan class="t"> cc -Wall -O2 -c -o build/x86_64-linux-gnu/main.o main.c -MMD -MF build/x86_64-linux-gnu/main.d</tspan></text>
  <text y="104" x="16"><tspan class="green-bold">[2/3]</tspan><tspan class="t"> cc -Wall -O2 -c -o build/x86_64-linux-gnu/greet.o greet.c -MMD -MF build/x86_64-linux-gnu/greet.d</tspan></text>
  <text y="126" x="16"><tspan class="green-bold">[3/3]</tspan><tspan class="t"> cc -o build/x86_64-linux-gnu/hello build/x86_64-linux-gnu/main.o build/x86_64-linux-gnu/greet.o</tspan></text>
  <text y="148" x="16"><tspan class="green">kiln:</tspan><tspan class="t"> built 3 targets</tspan></text>
  <text y="180" x="16"><tspan class="prompt">$</tspan><tspan class="t"> kiln Kilnfile</tspan></text>
  <text y="202" x="16"><tspan class="green">kiln:</tspan><tspan class="t"> nothing to do (all targets up to date)</tspan></text>
  <text y="234" x="16"><tspan class="prompt">$</tspan><tspan class="t"> kiln -a clean Kilnfile</tspan></text>
  <text y="256" x="16"><tspan class="red">rm</tspan><tspan class="t"> build/x86_64-linux-gnu/greet.o</tspan></text>
  <text y="278" x="16"><tspan class="red">rm</tspan><tspan class="t"> build/x86_64-linux-gnu/main.o</tspan></text>
  <text y="300" x="16"><tspan class="red">rm</tspan><tspan class="t"> build/x86_64-linux-gnu/hello</tspan></text>
  <text y="322" x="16"><tspan class="green">kiln:</tspan><tspan class="t"> removed 3 files</tspan></text>
</svg>
